<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ROAD RUSH: INFINITE</title>

    <link rel="stylesheet" href="./src/style.css">
</head>

<body>

    <!-- GAME -->
    <div id="game"></div>

    <!-- LOADING -->
    <div id="loading-screen" class="screen">
        <div class="loading-box">
            <div class="logo">ROAD RUSH</div>
            <div class="logo-small">INFINITE</div>

            <div class="loading-text" id="loading-text">
                LOADING CITY...
            </div>

            <div class="loading-bar">
                <div
                    id="loading-progress"
                    class="loading-progress"
                ></div>
            </div>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div
        id="main-menu"
        class="screen hidden"
    >
        <div class="menu-box">

            <div class="game-title">
                ROAD RUSH
            </div>

            <div class="game-subtitle">
                INFINITE
            </div>

            <p class="tagline">
                DRIVE • SURVIVE • DOMINATE
            </p>

            <button id="start-btn" class="main-button">
                START RACE
            </button>

            <button id="theme-btn" class="secondary-button">
                THEME: NIGHT CITY
            </button>

            <div class="controls">
                <div>
                    <b>W / ↑</b> Accelerate
                </div>

                <div>
                    <b>S / ↓</b> Brake
                </div>

                <div>
                    <b>A / ←</b> Steer Left
                </div>

                <div>
                    <b>D / →</b> Steer Right
                </div>

                <div>
                    <b>SPACE</b> Nitro
                </div>

                <div>
                    <b>ESC</b> Pause
                </div>
            </div>

        </div>
    </div>

    <!-- HUD -->
    <div id="hud">

        <div class="hud-item">
            <span>SCORE</span>
            <strong id="score">0</strong>
        </div>

        <div class="hud-item">
            <span>SPEED</span>
            <strong>
                <span id="speed">0</span>
                <small>KM/H</small>
            </strong>
        </div>

        <div class="hud-item">
            <span>COINS</span>
            <strong id="coins">0</strong>
        </div>

        <button id="pause-btn">
            II
        </button>

    </div>

    <!-- PAUSE -->
    <div
        id="pause-screen"
        class="screen hidden"
    >
        <div class="panel">

            <h1>PAUSED</h1>

            <button
                id="resume-btn"
                class="main-button"
            >
                RESUME
            </button>

            <button
                id="restart-btn"
                class="secondary-button"
            >
                RESTART
            </button>

            <button
                id="menu-btn"
                class="secondary-button"
            >
                MAIN MENU
            </button>

        </div>
    </div>

    <!-- GAME OVER -->
    <div
        id="game-over"
        class="screen hidden"
    >
        <div class="panel">

            <h1>RUN OVER</h1>

            <p>
                FINAL SCORE
            </p>

            <div
                id="final-score"
                class="final-score"
            >
                0
            </div>

            <button
                id="game-restart-btn"
                class="main-button"
            >
                RACE AGAIN
            </button>

            <button
                id="game-menu-btn"
                class="secondary-button"
            >
                MAIN MENU
            </button>

        </div>
    </div>

    <!-- MOBILE CONTROLS -->
    <div id="mobile-controls">

        <button
            id="left-control"
            class="drive-button"
        >
            ◀
        </button>

        <button
            id="brake-control"
            class="drive-button brake"
        >
            BRAKE
        </button>

        <button
            id="nitro-control"
            class="drive-button nitro"
        >
            NITRO
        </button>

        <button
            id="right-control"
            class="drive-button"
        >
            ▶
        </button>

    </div>

    <script
        type="module"
        src="./src/main.js"
    ></script>

</body>
</html>
